<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styling Practice</title>
    <style>

       p {
           color: red;
           width: 500px;
           border: 1px solid black;
           padding: 20px;
        }

        h1 {
            color:blue;
            width:600px;
            border: 4px solid brown;
            padding: 20px;
        }

        h2 {

            color: brown;
            font-size: 25px;
            padding: 10px;
        }

        li {
          color: gold;
          font-size: 24px;
          border: 1px solid grey;
          width: 200px;
          padding: 10px;

        }

        button {
            background-color: greenyellow;
            color: black;
            padding: 10px;
            border:  1px solid green;
        }

        footer {
            background-color: black;
            color: white;
            height: 200px;
            width: 1500px;
            padding: 10px;

        }


    </style>
</head>
<body>
    <header>
        <h1>Welcome to CSS Styling!</h1>
        <p >Use CSS to make this page look amazing!</p>
    </header>

    <main>
        <section>
            <h2>My Favorite Animals</h2>
            <ul>
                <li>Cat</li>
                <li>Dog</li>
                <li>Elephant</li>
            </ul>
        </section>

        <section>
            <h1>Fun Fact</h1>
            <p>Did you know that a group of flamingos is called a "flamboyance"?</p>
        </section>
    </main>

    <footer>
        <button>Click Me!</button>
        <p>&copy; 2025 CSS Masters</p>
    </footer>
</body>
</html>
