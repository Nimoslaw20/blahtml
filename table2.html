<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kente Pattern</title>
    <style>
        table {
            border-collapse: collapse;
            width: 500px;
            height: 500px;
        }
        td {
            width: 10%;
            height: 10%;
            border: 1px solid #000;
        }
        .color1 { background-color: #FF4500; } /* Orange Red */
        .color2 { background-color: #FFD700; } /* Gold */
        .color3 { background-color: #008000; } /* Green */
        .color4 { background-color: #0000FF; } /* Blue */
        .color5 { background-color: #800080; } /* Purple */
        .color6 { background-color: #FF6347; } /* Tomato */
        .color7 { background-color: #00CED1; } /* Dark Turquoise */
        .color8 { background-color: #9400D3; } /* Dark Violet */
        .color9 { background-color: #FF69B4; } /* Hot Pink */
        .color10 { background-color: #8B0000; } /* Dark Red */
    </style>
</head>
<body>
    <h2 style="text-align: center;">Kente Pattern</h2>
    <div style="display: flex; justify-content: space-around;">

                <td class="color3"></td><td class="color4"></td><td class="color5"></td><td class="color6"></td><td class="color7"></td>

</html>
